<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>Runner検証</title></head>
<body>
    <h1>タイトル</h1>
    <button onclick="window.confirmed = confirm('Continue?'); document.querySelector('#dialog-result').textContent = window.confirmed ? 'accepted' : 'dismissed'">Confirm dialog</button><p id="dialog-result"></p>
    <button class="save" onclick="window.clicks++">保存</button>
    <button class="save" onclick="window.clicks++">保存</button>
    <form id="target" onsubmit="event.preventDefault(); window.submissions++">
        <label for="login">Login ID</label><input id="login" name="login">
        <label for="password">パスワード</label><input id="password" type="password">
        <button type="submit">送信</button>
    </form>
    <form id="other" onsubmit="event.preventDefault(); window.otherSubmissions++"><input name="other"></form>
    <script>window.clicks=0; window.submissions=0; window.otherSubmissions=0;</script>
</body>
</html>
