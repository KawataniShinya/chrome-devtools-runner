<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>Runner検証</title></head>
<body>
    <h1>タイトル</h1>
    <button onclick="window.confirmed = confirm('Continue?'); document.querySelector('#dialog-result').textContent = window.confirmed ? 'accepted' : 'dismissed'">Confirm dialog</button><p id="dialog-result"></p>
    <button class="save" onclick="window.clicks++">保存</button>
    <button class="save" onclick="window.clicks++">保存</button>
    <form id="target" onsubmit="event.preventDefault(); window.submissions++">
        <label for="login">Login ID</label><input id="login" name="login">
        <label for="password">パスワード</label><input id="password" type="password">
        <button type="submit">送信</button>
    </form>
    <form id="other" onsubmit="event.preventDefault(); window.otherSubmissions++"><input name="other"></form>
    <section aria-label="Delivery">
        <label>Method <select><option>Pickup</option><option>Mail</option></select></label>
        <input type="date" aria-label="Delivery date">
        <input type="checkbox" aria-label="Confirmed">
        <input type="file" onchange="document.querySelector('#filename').textContent=this.files[0]?.name">
        <output id="filename"></output>
        <a download="report.txt" href="data:text/plain,report">Download report</a>
    </section>
    <script>window.clicks=0; window.submissions=0; window.otherSubmissions=0;</script>
    <div id="shipping">
        <button id="prepare">Prepare shipment</button>
        <button id="ship" aria-label="Ship now">Ship</button>
        <output id="shipment"></output>
    </div>
    <script>
        const shipping = document.querySelector('#shipping');
        let shipmentClicks = 0;
        shipping.querySelector('#prepare').onclick = () => {
            const cover = document.createElement('div');
            cover.style.cssText = 'position:fixed;inset:0;z-index:100;background:white';
            document.body.append(cover);
            const original = shipping.querySelector('#ship');
            original.onclick = () => { shipping.querySelector('output').textContent = 'stale click'; };
            setTimeout(() => {
                const replacement = original.cloneNode(true);
                original.replaceWith(replacement);
                replacement.onclick = event => {
                    shipping.querySelector('output').textContent =
                        [event.isTrusted, !cover.isConnected, ++shipmentClicks].join('/');
                };
            }, 350);
            setTimeout(() => cover.remove(), 700);
        };
    </script>
</body>
</html>
